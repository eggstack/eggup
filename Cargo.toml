[workspace]
resolver = "2"
members = [
    "crates/eggup-core",
    "crates/eggup-acquisition",
    "crates/eggup-eggfetch",
    "crates/eggup-curl",
    "crates/eggup-service",
    "crates/eggup-eggpack",
    "crates/eggup-transport-footprint",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggup"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
