[workspace]
resolver = "2"
members = [
    "crates/eggup-core",
    "crates/eggup-acquisition",
    "crates/eggup-eggfetch",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eggstack/eggup"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

