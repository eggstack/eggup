[package]
name = "eggup-package-consumer-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
eggup-core = { path = "vendor/eggup-core-0.1.2", version = "0.1.2" }
eggup-archive = { path = "vendor/eggup-archive-0.1.2", version = "0.1.2" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "6.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
