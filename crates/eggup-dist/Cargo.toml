[package]
name = "eggup-dist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/eggstack/eggup"
documentation = "https://docs.rs/eggup-dist"
description = "Versioned distribution contract schema for release-time tooling (no network, no extraction, no installer generation)"
readme = "README.md"
authors = ["David Bowman"]
keywords = ["distribution", "release", "installer", "packaging"]
categories = ["development-tools"]
exclude = [
    "tests/",
    "benches/",
]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
