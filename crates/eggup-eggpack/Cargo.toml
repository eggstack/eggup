[package]
name = "eggup-eggpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/eggstack/eggup"
documentation = "https://docs.rs/eggup-eggpack"
description = "Optional Eggpack ReleaseManifest adapter for Eggup deployment inputs (no release policy, authenticity, or destination selection)"
readme = "README.md"
authors = ["David Bowman"]
keywords = ["update", "eggpack", "manifest", "adapter"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
eggup-core = { version = "=0.1.2", path = "../eggup-core" }
eggup-archive = { version = "=0.1.2", path = "../eggup-archive" }
eggup-acquisition = { version = "=0.1.2", path = "../eggup-acquisition" }
eggpack-manifest = "=0.1.0"
sha2 = "0.10.9"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "6.0", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
