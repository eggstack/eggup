[package]
name = "eggup-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/eggstack/eggup"
documentation = "https://docs.rs/eggup-core"
description = "Policy-neutral local mechanics for verified multi-artifact updates (checksum integrity only, no transport or service manager)"
readme = "README.md"
authors = ["David Bowman"]
keywords = ["update", "installer", "integrity", "rollback", "deployment"]
categories = ["os", "filesystem"]
exclude = [
    "docs/",
    "tests/",
    "benches/",
]

[lints]
workspace = true

[dependencies]
sha2 = "0.10"

# Windows-only. A running image cannot be unlinked while it is mapped, so the
# previous generation of a kept-installed self-update is scheduled for deletion
# after this process exits. It is never called before the caller's post-commit
# policy has resolved, and it is never reachable on any other target, so the
# Unix/macOS dependency graph is unchanged.
[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
